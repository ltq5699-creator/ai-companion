name: Build Android APK

# 云端免费打包：推代码 / 手动点一下按钮，就能在 Actions 里下载 apk
# GitHub 对公开仓库的 Actions 分钟数免费，无需本地安装 Android SDK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许在 Actions 页面手动点「Run workflow」

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK（自动接受许可 + 安装平台/构建工具/NDK）
        uses: android-actions/setup-android@v3
        with:
          # 自动接受 SDK 许可协议（默认 true）
          accept-android-sdk-licenses: true
          # 安装 RN 0.75 构建所需组件：平台 34 + 构建工具 34.0.0 + NDK 26.1.10909125
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 打包 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ai-companion-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 顺手也出一个 Debug 包（可选，方便排错）
        if: failure()
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon || true
